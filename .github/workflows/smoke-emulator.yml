name: Emulator smoke test

# Phase 0 sandbox spike: run the by-hand install checklist against the
# spike APK inside an arm64 Android emulator, BEFORE the APK is handed to
# a phone. The app is arm64-native (arm64chroot), so the emulator must run
# an arm64-v8a system image — only an ARM host can do that at usable
# speed, hence an ARM runner + android-emulator-runner. Runner history,
# learned from this workflow's own runs on 2026-10-30:
#  * macos-14: image retired 2026-11-02; its scheduled brownout that day
#    cancelled run 41117956589 in one second (no runner, no steps).
#  * macos-15 (standard): the emulator cannot start at all — verbatim
#    from run 41118111225: "HVF error: HV_UNSUPPORTED" /
#    "qemu-system-aarch64-headless: failed to initialize HVF" / QEMU
#    exits code 1; GitHub's standard macOS 15 runners do not expose the
#    Hypervisor framework to guests.
#  * ubuntu-24.04-arm: dead end twice over (runs 41120228406 and
#    41120350952). /dev/kvm does not exist on those runners ("ls: cannot
#    access '/dev/kvm'"), and Google's SDK repository ships the emulator
#    package for linux_x64 only — no linux_aarch64 build exists, so
#    sdkmanager fails with "Warning: Failed to find package 'emulator'".
#  * macos-26 (standard): the same HVF wall as macos-15, verbatim in
#    run 41120930554.
#  * macos-15-xlarge (STANDING CHOICE): the larger macOS runners are
#    bare-metal Apple Silicon, where HVF works — but run 41120650268
#    never started. GitHub's annotation on job 124286118503, verbatim:
#    "The job was not started because recent account payments have
#    failed or your spending limit needs to be increased. Please check
#    the 'Billing & plans' section in your settings". Larger runners
#    are billed even for public repos; only the account owner can clear
#    that gate. The moment it is cleared, dispatching this workflow
#    runs the checklist below end to end.
# A local x86 VM cannot do this at all: current emulators refuse to boot
# arm64 images on x86_64 hosts, and an x86_64 guest under pure software
# emulation (no KVM) did not finish its first boot in 37 minutes.
#
# The checklist itself lives in .github/scripts/smoke.sh. It proves what
# automation honestly reaches on stock Android: APK install, first-run
# wizard, Alpine rootfs extraction (verified in the app's data dir), and
# the app process surviving its first auto-created userland session.
# It deliberately does NOT drive a shell inside the userland: the app
# exposes no intent/service/API route into one, so the checklist stops
# at extraction-verified and says so. Samsung One UI behaviour and real
# Fold 6 speed remain phone-only questions no emulator can answer.
#
# The APK is consumed from the release published by build-spike.yml
# (one source of truth for the tested artifact; no rebuild here).

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag holding the spike APK"
        required: true
        default: "spike-build-1"
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-15-xlarge
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download spike APK from release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p apk
          gh release download "$RELEASE_TAG" --pattern '*.apk' --dir apk
          ls -la apk
          sha256sum apk/*.apk || shasum -a 256 apk/*.apk

      - name: Run smoke checklist in arm64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: arm64-v8a
          profile: pixel_6
          avd-name: smoke-avd
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -camera-back none -noaudio -no-boot-anim
          script: bash .github/scripts/smoke.sh

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence-${{ github.run_id }}
          path: smoke-out/
          if-no-files-found: warn
